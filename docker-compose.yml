version: '3.8'

services:
  app:
    image: node:latest
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: >
      bash -lc "
      apt-get update &&
      apt-get install -y --no-install-recommends
        python3 python-is-python3 make g++ pkg-config
        libgl1-mesa-dev libglu1-mesa-dev libxi-dev &&
      rm -rf /var/lib/apt/lists/* &&
      (npm ci || npm install) &&
      node main.js
      "
    ports:
      - "3001-3003:3001-3003" # see the view from the camera mounted on your bot head: http://localhost:3000/

  viaproxy: #use this service to connect to an unsupported minecraft server versions. more info: ./services/viaproxy/README.md
    image: ghcr.io/viaversion/viaproxy:latest
    volumes:
      - ./services/viaproxy:/app/run
    ports:
      - "25568:25568"
    profiles:
      - viaproxy
